# Official single-window time-to-event sweep.
#
# There are 9 receptive-field variants (3 depths x 3 kernel sets). The active
# sweep crosses them with marked, joint competing-risk, and cause-specific
# competing-risk variants under the two deterministic sampling regimes below.
# submit_jobs.py expands this to a Cartesian sweep.
models:
  - Inception_classifier
seeds_file: seeds.txt
ntrials: 1
train_script: train_time_to_event_models.py
python_exec: uv run --active python
# python_exec: python

trace_file: data/MFM_tracings.sample_limit-all.sample_rate-025.horizon-0.max_gap_hours-18.window-full.min_length-30.tail_length-2880.missingness-none.h5
label_trainfile: data/MFM_labs_train.parquet
label_testfile: data/MFM_labs_test.parquet
splits_file: data/train_val_test_splits_extended.csv
chunksizes: [900]
lab_order_delays: [30]
default_batch_size: 2048
model_batch_size_map:
  Inception_classifier: 2048
model_chunksize_map:
  Inception_classifier: [900]

train_kwargs:
  epochs: 100
  mark_loss_weight: 1.0
  weight_decay: 0.0
  deephit_alpha: 0.5
  deephit_sigma: 0.2
  lr_schedule: cosine
  learning_rate: 0.01
  lr_warmup_fraction: 0.05
  lr_min_fraction: 0.01
  early_stopping_patience: 30
  bootstrap_samples: 100
  bootstrap_confidence_level: 0.95
  durations: [0, 600, 1200, 2400, 3600, 7200, 14400, 28800, 50400, 86400, 172800]
  elapsed_time_feature: false
  elapsed_time_channel: true
  elapsed_time_scale_seconds: 43200
  missingness_indicator_channels: true
  validation_landmarks_per_patient: 4
  progress_bar: false
  chunk_missingness_max_fraction: 0.30
  chunk_eligibility_cache_dir: cache/chunk_eligibility
  missing_data_method: ffill
  training_landmark_diagnostic_patients: 0

# Validation remains deterministic at the fixed delivery endpoints for every
# run. The cause-specific competing variants use the independent MLP head
# architecture while retaining the same targets and sampling regimes as the
# joint competing-risk controls.
train_kwargs_variants:
  - _name: marked_all_deterministic
    mode: marked
    training_sampling_strategy: all
    epochs: 20
    learning_rate: 0.005
  - _name: marked_quartiles_plus_terminal_deterministic
    mode: marked
    training_sampling_strategy: quartiles_plus_terminal
  - _name: marked_terminal_balanced_deterministic
    mode: marked
    training_sampling_strategy: terminal_balanced
  - _name: marked_stratified_elapsed_deterministic
    mode: marked
    training_sampling_strategy: stratified_elapsed

  - _name: competing_cause_specific_all_deterministic
    mode: competing
    competing_head: cause_specific
    competing_head_hidden_dims: [128, 64]
    training_sampling_strategy: all
    epochs: 20
    learning_rate: 0.005
  - _name: competing_cause_specific_quartiles_plus_terminal_deterministic
    mode: competing
    competing_head: cause_specific
    competing_head_hidden_dims: [128, 64]
    training_sampling_strategy: quartiles_plus_terminal
  - _name: competing_cause_specific_terminal_balanced_deterministic
    mode: competing
    competing_head: cause_specific
    competing_head_hidden_dims: [128, 64]
    training_sampling_strategy: terminal_balanced
  - _name: competing_cause_specific_stratified_elapsed_deterministic
    mode: competing
    competing_head: cause_specific
    competing_head_hidden_dims: [128, 64]
    training_sampling_strategy: stratified_elapsed

  # - _name: competing_all_deterministic
  #   mode: competing
  #   training_sampling_strategy: all
  # - _name: competing_quartiles_plus_terminal_deterministic
  #   mode: competing
  #   training_sampling_strategy: quartiles_plus_terminal
  # - _name: competing_terminal_balanced_deterministic
  #   mode: competing
  #   training_sampling_strategy: terminal_balanced
  # - _name: competing_stratified_elapsed_deterministic
  #   mode: competing
  #   training_sampling_strategy: stratified_elapsed

model_fit_kwargs_map:
  Inception_classifier:
    - _name: depth1_k5_9_19
      n_filters: 32
      depth: 1
      bottleneck_channels: 32
      kernel_sizes: [19, 9, 5]
    - _name: depth2_k5_9_19
      n_filters: 32
      depth: 2
      bottleneck_channels: 32
      kernel_sizes: [19, 9, 5]
    - _name: depth3_k5_9_19
      n_filters: 32
      depth: 3
      bottleneck_channels: 32
      kernel_sizes: [19, 9, 5]
    - _name: depth1_k9_19_39
      n_filters: 32
      depth: 1
      bottleneck_channels: 32
      kernel_sizes: [39, 19, 9]
    - _name: depth2_k9_19_39
      n_filters: 32
      depth: 2
      bottleneck_channels: 32
      kernel_sizes: [39, 19, 9]
    - _name: depth3_k9_19_39
      n_filters: 32
      depth: 3
      bottleneck_channels: 32
      kernel_sizes: [39, 19, 9]
    - _name: depth1_k19_39_79
      n_filters: 32
      depth: 1
      bottleneck_channels: 32
      kernel_sizes: [79, 39, 19]
    - _name: depth2_k19_39_79
      n_filters: 32
      depth: 2
      bottleneck_channels: 32
      kernel_sizes: [79, 39, 19]
    - _name: depth3_k19_39_79
      n_filters: 32
      depth: 3
      bottleneck_channels: 32
      kernel_sizes: [79, 39, 19]

savedir: results/
gpu: 0
time_limit: "03-00:00:00"
mem: 16G
submit: false
print_only: false
local: false
